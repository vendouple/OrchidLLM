<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign In — OrchidLLM</title>
<meta name="description" content="Sign in to OrchidLLM to manage your API keys, view usage, and access premium models.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@m3e/web@2.0.5/dist/all.min.js/+esm"></script>
<style>
:root {
  --p: #6B21D8; --on-p: #fff;
  --pc: #EDE9FE; --on-pc: #3B0764;
  --s: #0284C7; --on-s: #fff;
  --t: #E11D48; --on-t: #fff;
  --tc: #FFE4E6; --on-tc: #881337;
  --bg: #FAFAFA; --on-bg: #1A1625;
  --surf: #FFFFFF; --on-surf: #1A1625;
  --surf-lo: #F4F0FA; --surf-mid: #EEE9F5;
  --surf-hi: #E8E3F0;
  --out: #7C7589; --out-v: #CAC4D0;
  --err: #B91C1C; --err-c: #FEE2E2;
  --r-pill: 9999px; --r-xl: 28px; --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --sh1: 0 1px 4px rgba(107,33,216,.1), 0 1px 2px rgba(0,0,0,.08);
  --sh2: 0 4px 16px rgba(107,33,216,.12), 0 2px 8px rgba(0,0,0,.1);
  --sh3: 0 8px 32px rgba(107,33,216,.15), 0 4px 16px rgba(0,0,0,.12);
  --spring: cubic-bezier(0.05,0.7,0.1,1);
  --std: cubic-bezier(0.2,0,0,1);
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
}
[data-theme="dark"] {
  --p: #C4B5FD; --on-p: #3B0764;
  --pc: #4C1D95; --on-pc: #EDE9FE;
  --s: #7DD3FC; --on-s: #0C4A6E;
  --t: #FDA4AF; --on-t: #881337;
  --tc: #881337; --on-tc: #FFE4E6;
  --bg: #0D0A14; --on-bg: #EAE6F0;
  --surf: #14101F; --on-surf: #EAE6F0;
  --surf-lo: #181224; --surf-mid: #1E1730;
  --surf-hi: #252040;
  --out: #9A94A8; --out-v: #3D3652;
  --err: #FCA5A5; --err-c: #7F1D1D;
  --sh1: 0 1px 4px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.4);
  --sh2: 0 4px 16px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.4);
  --sh3: 0 8px 32px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.45);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--on-bg);
  -webkit-font-smoothing: antialiased;
}
.ms {
  font-family: 'Material Symbols Rounded';
  font-weight: normal; font-style: normal;
  font-size: 22px; line-height: 1;
  letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap;
  word-wrap: normal; direction: ltr;
  -webkit-font-smoothing: antialiased;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  user-select: none; pointer-events: none;
}
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }

.login-shell {
  display: flex; align-items: center; justify-content: center;
  width: 100vw; height: 100vh; height: 100dvh;
  background: var(--bg);
  position: relative; overflow: hidden;
}
/* Animated background orbs */
.login-shell::before, .login-shell::after {
  content: ''; position: absolute; border-radius: 50%;
  filter: blur(100px); opacity: .18; pointer-events: none;
  animation: orbFloat 12s ease-in-out infinite alternate;
}
.login-shell::before {
  width: 500px; height: 500px; top: -120px; left: -100px;
  background: var(--p);
}
.login-shell::after {
  width: 400px; height: 400px; bottom: -80px; right: -60px;
  background: var(--t); animation-delay: -6s;
}
@keyframes orbFloat {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(40px, 30px) scale(1.12); }
}

.login-card {
  position: relative; z-index: 1;
  width: min(420px, calc(100vw - 40px));
  background: var(--surf);
  border: 1px solid var(--out-v);
  border-radius: var(--r-xl);
  padding: 48px 40px 40px;
  box-shadow: var(--sh3);
  display: flex; flex-direction: column; align-items: center;
  gap: 28px;
  animation: cardIn .5s var(--spring);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(24px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.login-back {
  position: absolute; top: 16px; left: 16px;
  display: flex; align-items: center; gap: 4px;
  color: var(--out); font-size: 13px; font-weight: 600;
  text-decoration: none; padding: 6px 10px; border-radius: var(--r-md);
  transition: background .2s, color .2s;
}
.login-back:hover { background: var(--surf-hi); color: var(--on-surf); text-decoration: none; }
.login-back .ms { font-size: 18px; pointer-events: none; }

.login-logo {
  width: 72px; height: 72px; border-radius: 28px;
  background: linear-gradient(145deg, var(--p), var(--t));
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--sh2), 0 0 0 6px color-mix(in srgb, var(--p) 12%, transparent);
  position: relative; overflow: hidden;
}
.login-logo::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), transparent 60%);
}
.login-logo .ms { color: #fff; font-size: 34px; font-variation-settings: 'FILL' 1, 'wght' 500; }

.login-heading {
  text-align: center;
}
.login-heading h1 {
  font-size: 26px; font-weight: 800; letter-spacing: -.4px;
  background: linear-gradient(135deg, var(--p) 30%, var(--t) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.login-heading p {
  margin-top: 8px; font-size: 14px; color: var(--out); line-height: 1.6;
}

.login-github-btn {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%; padding: 14px 20px;
  background: var(--on-surf); color: var(--surf);
  border: none; border-radius: var(--r-lg);
  font-size: 15px; font-weight: 700; font-family: var(--font);
  cursor: pointer; text-decoration: none;
  transition: opacity .15s, transform .15s var(--spring), box-shadow .2s;
  box-shadow: var(--sh1);
}
.login-github-btn:hover {
  opacity: .88; transform: translateY(-1px); box-shadow: var(--sh2);
  text-decoration: none; color: var(--surf);
}
.login-github-btn:active { transform: scale(.98); box-shadow: none; }
.login-github-btn svg { flex-shrink: 0; }

.login-divider {
  width: 100%; display: flex; align-items: center; gap: 14px;
  color: var(--out); font-size: 12px; font-weight: 600;
}
.login-divider::before, .login-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--out-v);
}

.login-footer {
  text-align: center; font-size: 12px; color: var(--out); line-height: 1.7;
}
.login-footer a { color: var(--p); text-decoration: underline; font-weight: 600; }
.login-footer a:hover { color: var(--on-surf); }

/* Loading state */
.login-github-btn.loading {
  pointer-events: none; opacity: .6;
}
.login-github-btn.loading svg { display: none; }
.login-github-btn.loading::before {
  content: ''; width: 18px; height: 18px;
  border: 2px solid transparent; border-top-color: currentColor;
  border-radius: 50%; animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .login-card { padding: 40px 24px 32px; border-radius: 20px; }
  .login-logo { width: 60px; height: 60px; border-radius: 22px; }
  .login-logo .ms { font-size: 28px; }
  .login-heading h1 { font-size: 22px; }
}
</style>
</head>
<body>
<m3e-theme color-scheme="light">

<div class="login-shell" id="login-shell">
  <div class="login-card">
    <a href="/index.html" class="login-back" id="login-back-btn">
      <span class="ms">arrow_back</span> Back
    </a>

    <div class="login-logo">
      <span class="ms fill">auto_awesome</span>
    </div>

    <div class="login-heading">
      <h1>Welcome to OrchidLLM</h1>
      <p>Sign in to manage API keys, track usage, and unlock premium models.</p>
    </div>

    <a href="/api/auth/github" class="login-github-btn" id="github-login-btn" onclick="this.classList.add('loading'); this.textContent='Redirecting…';">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      Sign in with GitHub
    </a>

    <div class="login-divider">or</div>

    <div class="login-footer">
      Try the <a href="/index.html">AI Playground</a> without an account.<br>
      By signing in, you agree to OrchidLLM's <a href="#">Terms of Service</a>.
    </div>
  </div>
</div>

</m3e-theme>
<script>
(function() {
  // Apply saved theme
  const saved = localStorage.getItem('orchid-dark');
  if (saved === '1' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.querySelector('m3e-theme')?.setAttribute('color-scheme', 'dark');
  }
  // Parse returnTo param for back button
  const params = new URLSearchParams(window.location.search);
  const returnTo = params.get('returnTo') || '/index.html';
  const backBtn = document.getElementById('login-back-btn');
  if (backBtn) backBtn.href = returnTo;
})();
</script>
</body>
</html>
